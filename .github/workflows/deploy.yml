name: 发布到 Cloudflare Pages

# 触发条件：推送到 main 分支，或在 GitHub 网页上手动点按钮跑一次
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，避免两次推送互相覆盖
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Hugo（与本地同版本 0.168.0 extended）
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: 构建站点
        # baseURL 已写进 hugo.toml，命令行不再覆盖它。
        # 本地 .hugo_build.lock 权限异常会让构建直接失败，CI 上一律 --noBuildLock 更稳。
        run: hugo --cleanDestinationDir --noBuildLock

      - name: 检查有没有超过 25MB 的文件
        run: |
          big=$(find public -type f -size +25M)
          if [ -n "$big" ]; then
            echo "::error::以下文件超过 Cloudflare 的 25MB 单文件上限："
            echo "$big"
            exit 1
          fi
          echo "文件数：$(find public -type f | wc -l)"

      - name: 检查关键产物（缓存头 / robots / 指纹资源）
        run: |
          test -f public/_headers   || { echo "::error::缺少 public/_headers，长缓存策略不会生效"; exit 1; }
          test -f public/robots.txt || { echo "::error::缺少 public/robots.txt"; exit 1; }
          ls public/css public/js
          grep -q 'Cache-Control: public, max-age=31536000' public/_headers \
            || { echo "::error::_headers 里没有长缓存规则"; exit 1; }

      - name: 上传到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID 不算密钥：它出现在 Cloudflare 后台每一条链接里，公开仓库里写死没问题
          accountId: 630bce62c4f787db1dd3d169a040fbf6
          command: pages deploy public --project-name=shouye-blog --branch=main
